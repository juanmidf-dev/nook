name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - name: Compilar
        env:
          # Token de relleno: la compilación no llama a Mapbox, solo necesita
          # que la variable exista para no entrar en la pantalla de error.
          VITE_MAPBOX_TOKEN: pk.ci
        run: npm run build

      - name: El fixture del motor de calor sigue al día
        # `pipelines/tests/test_heat.py` compara heat.py contra la salida real
        # de heat.ts, guardada en ese fixture. Si alguien toca heat.ts y no lo
        # regenera, el test seguiría pasando contra la versión antigua y la
        # equivalencia dejaría de estar comprobada sin que nadie lo notara.
        run: |
          node scripts/exportar_heat_ts.mjs
          if ! git diff --quiet pipelines/tests/fixtures/heat_ts.json; then
            echo "::error::heat.ts ha cambiado y el fixture no. Ejecuta 'node scripts/exportar_heat_ts.mjs' y commitea el resultado."
            git --no-pager diff --stat pipelines/tests/fixtures/heat_ts.json
            exit 1
          fi

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - working-directory: pipelines
        run: |
          pip install -r requirements.txt
          python -m pytest tests -q
