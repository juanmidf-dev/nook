name: Mantener Supabase despierto

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad, y
# la ingesta es mensual: sin esto, cada vez que arranque el cron del día 3 se
# encontrará la base de datos pausada y fallará. Una lectura trivial cuenta
# como actividad y sale gratis.
#
# Dos veces por semana y no una: con siete días justos no hay ningún margen.
# GitHub retrasa las ejecuciones programadas cuando va cargado, y una sola
# ejecución perdida ya deja pasar la ventana.

on:
  schedule:
    - cron: '23 5 * * 1,4'   # lunes y jueves; el minuto raro, para no coincidir con la hora en punto
  workflow_dispatch:

# Si una ejecución se solapa con otra no aporta nada: basta la más reciente.
concurrency:
  group: mantener-supabase
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tocar la API REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_KEY}" ]; then
            echo "::notice::Faltan SUPABASE_URL o SUPABASE_SERVICE_KEY. Nada que mantener despierto todavía."
            exit 0
          fi

          # Diagnostico de la configuracion. Se imprimen hechos derivados y
          # nunca los valores: GitHub enmascara los secretos en el log, asi que
          # imprimirlos tal cual solo mostraria ***, que no ayuda a nadie.
          echo "--- configuracion ---"
          case "${SUPABASE_URL}" in
            https://*) echo "url: empieza por https" ;;
            *)         echo "::error::La URL no empieza por https. Debe ser https://<ref>.supabase.co" ;;
          esac
          case "${SUPABASE_URL}" in
            */rest/v1|*/rest/v1/)
              echo "::error::SUPABASE_URL ya incluye /rest/v1. El codigo lo anade solo, asi que la ruta queda duplicada y todo responde 404. Deja solo https://<ref>.supabase.co" ;;
            *supabase.co|*supabase.co/)
              echo "url: termina en supabase.co, sin ruta extra (correcto)" ;;
            *)
              echo "::warning::La URL no termina en supabase.co ni en /rest/v1. Revisa que no lleve ninguna ruta detras." ;;
          esac
          case "${SUPABASE_SERVICE_KEY}" in
            sb_secret_*)      echo "clave: formato nuevo secreto (correcto)" ;;
            sb_publishable_*) echo "::error::La clave es la PUBLICABLE, no la secreta. Es la que va en el frontend y no puede escribir." ;;
            eyJ*)             echo "clave: JWT legado (service_role o anon)" ;;
            *)                echo "::warning::Formato de clave no reconocido." ;;
          esac
          echo "---------------------"

          # Las claves nuevas (sb_secret_...) no son JWT y no pueden ir en
          # Authorization: la petición llega a la base de datos y se rechaza al
          # leerlas como token. Las legadas sí lo son y lo necesitan. Se
          # distingue por la forma, igual que en pipelines/nook/salida.py.
          AUTORIZACION=()
          case "${SUPABASE_SERVICE_KEY}" in
            eyJ*) AUTORIZACION=(-H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}") ;;
          esac

          # Se consulta una tabla real, no la raíz de la API: el objetivo es
          # que la petición llegue a Postgres, y la raíz responde sin tocarlo.
          CODIGO=$(curl -s -o /tmp/respuesta.txt -w '%{http_code}' \
            --max-time 60 --retry 2 --retry-delay 10 \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            "${AUTORIZACION[@]}" \
            "${SUPABASE_URL%/}/rest/v1/ingestas?select=id&limit=1")

          echo "HTTP ${CODIGO}"
          case "${CODIGO}" in
            2*)
              echo "::notice::Proyecto despierto y respondiendo."
              ;;
            404)
              # PostgREST ha contestado, así que la base de datos está viva;
              # lo que falta es el esquema. Cumple su función igualmente.
              echo "::warning::404 sobre 'ingestas'. O falta aplicar infra/schema.sql, o la ruta no es la que crees."
              cat /tmp/respuesta.txt; echo
              # PostgREST publica en su raiz las tablas que expone. Si esto
              # responde, el problema es la tabla; si tambien da 404, es la URL.
              echo "--- raiz de la API ---"
              : > /tmp/raiz.txt
              RAIZ=$(curl -s -o /tmp/raiz.txt -w '%{http_code}' --max-time 30 -H "apikey: ${SUPABASE_SERVICE_KEY}" "${AUTORIZACION[@]}" "${SUPABASE_URL%/}/rest/v1/" || echo "sin-respuesta")
              echo "raiz -> HTTP ${RAIZ}"
              head -c 400 /tmp/raiz.txt || true
              echo
              ;;
            401|403)
              echo "::error::Credenciales rechazadas (${CODIGO}). Revisa SUPABASE_SERVICE_KEY: debe ser la clave secreta, no la publishable."
              cat /tmp/respuesta.txt
              exit 1
              ;;
            *)
              echo "::error::Respuesta inesperada (${CODIGO}). El proyecto puede estar pausado."
              cat /tmp/respuesta.txt
              exit 1
              ;;
          esac
